version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: nfcgate-postgres
    environment:
      POSTGRES_USER: nfcgate
      POSTGRES_PASSWORD: nfcgate
      POSTGRES_DB: nfcgate
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nfcgate -d nfcgate']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: ./server
    container_name: nfcgate-server
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://nfcgate:nfcgate@postgres:5432/nfcgate?schema=public
      JWT_SECRET: change-me
      CORS_ORIGIN: http://localhost:3000
      RELAY_TOKEN_TTL_MINUTES: 1440
      SESSION_TOKEN_TTL_MINUTES: 60
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
