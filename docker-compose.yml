version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: nfcgate-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nfcgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-nfcgate}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    image: node:20-alpine
    container_name: nfcgate-server
    working_dir: /app
    volumes:
      - ./server:/app
    environment:
      PORT: ${SERVER_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-nfcgate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nfcgate}?schema=public}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CARD_ENCRYPTION_KEY: ${CARD_ENCRYPTION_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    command: >
      sh -c "npm install && npx prisma generate && npx prisma db push && npm run dev"
    ports:
      - '${SERVER_PORT:-8080}:${SERVER_PORT:-8080}'
    depends_on:
      - postgres

  admin-panel:
    image: node:20-alpine
    container_name: nfcgate-admin-panel
    working_dir: /app
    volumes:
      - ./admin-panel:/app
    environment:
      # For browser clients, use externally reachable host; in production set this to your public domain.
      NEXT_PUBLIC_API_BASE: http://localhost:${SERVER_PORT:-8080}/api
      PORT: ${ADMIN_PORT:-3001}
    command: >
      sh -c "npm install && npm run dev -- -H 0.0.0.0 -p ${ADMIN_PORT:-3001}"
    ports:
      - '${ADMIN_PORT:-3001}:${ADMIN_PORT:-3001}'
    depends_on:
      - server

volumes:
  postgres_data:
