apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfcgate-server
  labels:
    app: nfcgate-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nfcgate-server
  template:
    metadata:
      labels:
        app: nfcgate-server
    spec:
      containers:
        - name: nfcgate-server
          image: nfcgate/server:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nfcgate-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nfcgate-secrets
                  key: jwt-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: nfcgate-secrets
                  key: jwt-refresh-secret
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
