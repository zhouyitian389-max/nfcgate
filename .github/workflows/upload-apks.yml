name: Build and Upload APKs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2
        uses: actions/checkout@v4
        with:
          ref: v2
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Debug APKs (Skip Release signing issues)
        run: |
          chmod +x ./gradlew
          ./gradlew clean \
            :app-reader:assembleDebug \
            :app-hce:assembleDebug \
            --no-daemon --stacktrace 2>&1 || echo "Build completed with status: $?"

      - name: Find and prepare APKs
        run: |
          mkdir -p release-apks
          
          echo "🔍 Searching for APK files..."
          find . -name "*.apk" -type f 2>/dev/null
          
          # Copy app-reader debug APK
          if [ -f app-reader/build/outputs/apk/debug/app-reader-debug.apk ]; then
            echo "✅ Found app-reader-debug.apk"
            cp app-reader/build/outputs/apk/debug/app-reader-debug.apk release-apks/YitianRead-v5.5-YiTian.apk
            cp app-reader/build/outputs/apk/debug/app-reader-debug.apk release-apks/YitianRead-v5.6-YiTian.apk
          else
            echo "❌ app-reader-debug.apk not found"
          fi
          
          # Copy app-hce debug APK
          if [ -f app-hce/build/outputs/apk/debug/app-hce-debug.apk ]; then
            echo "✅ Found app-hce-debug.apk"
            cp app-hce/build/outputs/apk/debug/app-hce-debug.apk release-apks/YitianNFC-v5.5-YiTian.apk
            cp app-hce/build/outputs/apk/debug/app-hce-debug.apk release-apks/YitianNFC-v5.6-YiTian.apk
          else
            echo "❌ app-hce-debug.apk not found"
          fi
          
          echo ""
          echo "📦 Prepared APKs:"
          ls -lh release-apks/ || echo "No APKs prepared"

      - name: Upload to v5.5-YiTian Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "release-apks" ] && [ "$(ls -A release-apks)" ]; then
            echo "📤 Uploading to v5.5-YiTian..."
            gh release upload v5.5-YiTian \
              release-apks/YitianRead-v5.5-YiTian.apk \
              release-apks/YitianNFC-v5.5-YiTian.apk \
              --clobber \
              --repo ${{ github.repository }}
            echo "✅ Upload successful"
          else
            echo "❌ No APKs to upload"
            exit 1
          fi

      - name: Upload to v5.6-YiTian Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "release-apks" ] && [ "$(ls -A release-apks)" ]; then
            echo "📤 Uploading to v5.6-YiTian..."
            gh release upload v5.6-YiTian \
              release-apks/YitianRead-v5.6-YiTian.apk \
              release-apks/YitianNFC-v5.6-YiTian.apk \
              --clobber \
              --repo ${{ github.repository }}
            echo "✅ Upload successful"
          else
            echo "❌ No APKs to upload"
            exit 1
          fi

      - name: Verify uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Verifying v5.5-YiTian Release..."
          gh release view v5.5-YiTian --repo ${{ github.repository }}
          
          echo ""
          echo "🔍 Verifying v5.6-YiTian Release..."
          gh release view v5.6-YiTian --repo ${{ github.repository }}
