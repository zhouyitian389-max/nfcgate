name: Build and Upload APKs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build debug APK with Gradle
        run: ./gradlew assembleDebug --info

      - name: Collect and rename APKs
        run: |
          mkdir -p release-apks

          # app-reader
          if [ -f app-reader/build/outputs/apk/debug/app-reader-debug.apk ]; then
            cp app-reader/build/outputs/apk/debug/app-reader-debug.apk release-apks/YitianRead-v5.8-YiTian.apk
            echo "✅ app-reader APK ready"
          fi

          # app-hce
          if [ -f app-hce/build/outputs/apk/debug/app-hce-debug.apk ]; then
            cp app-hce/build/outputs/apk/debug/app-hce-debug.apk release-apks/YitianNFC-v5.8-YiTian.apk
            echo "✅ app-hce APK ready"
          fi

          echo "📦 APKs:"
          ls -lh release-apks/

      - name: Upload to v5.8-YiTian Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v5.8-YiTian \
            release-apks/YitianRead-v5.8-YiTian.apk \
            release-apks/YitianNFC-v5.8-YiTian.apk \
            --clobber --repo ${{ github.repository }}
          echo "✅ v5.8-YiTian uploaded"

      - name: Verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== v5.8-YiTian assets ==="
          gh release view v5.8-YiTian --repo ${{ github.repository }} --json assets --jq '.assets[].name'
          echo "🎉 Done!"
