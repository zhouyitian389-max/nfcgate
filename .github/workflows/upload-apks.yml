name: Build and Upload APKs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2 with submodules
        uses: actions/checkout@v4
        with:
          ref: v2
          fetch-depth: 0
          submodules: recursive

      - name: Verify submodule protocol exists
        run: |
          echo "Checking protocol submodule..."
          ls -la protobuf/src/main/proto/protocol/ || true
          if [ ! -d "protobuf/src/main/proto/protocol" ] || [ -z "$(ls -A protobuf/src/main/proto/protocol 2>/dev/null)" ]; then
            echo "Submodule missing, trying manual init..."
            git submodule sync --recursive
            git submodule update --init --recursive
          fi
          echo "Proto files:"
          find protobuf/src/main/proto -name "*.proto" -type f

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build Debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew clean \
            :app:assembleDebug \
            :app-reader:assembleDebug \
            :app-hce:assembleDebug \
            --no-daemon --stacktrace

      - name: Collect and rename APKs
        run: |
          mkdir -p release-apks
          
          # app-reader
          if [ -f app-reader/build/outputs/apk/debug/app-reader-debug.apk ]; then
            cp app-reader/build/outputs/apk/debug/app-reader-debug.apk release-apks/YitianRead-v5.5-YiTian.apk
            cp app-reader/build/outputs/apk/debug/app-reader-debug.apk release-apks/YitianRead-v5.6-YiTian.apk
            echo "✅ app-reader APK ready"
          fi
          
          # app-hce
          if [ -f app-hce/build/outputs/apk/debug/app-hce-debug.apk ]; then
            cp app-hce/build/outputs/apk/debug/app-hce-debug.apk release-apks/YitianNFC-v5.5-YiTian.apk
            cp app-hce/build/outputs/apk/debug/app-hce-debug.apk release-apks/YitianNFC-v5.6-YiTian.apk
            echo "✅ app-hce APK ready"
          fi
          
          echo ""
          echo "📦 All APKs:"
          ls -lh release-apks/
          
          count=$(find release-apks -name "*.apk" -type f | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "❌ No APKs found!"
            exit 1
          fi
          echo "✅ Found $count APK(s)"

      - name: Upload to v5.5-YiTian Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v5.5-YiTian \
            release-apks/YitianRead-v5.5-YiTian.apk \
            release-apks/YitianNFC-v5.5-YiTian.apk \
            --clobber \
            --repo ${{ github.repository }}
          echo "✅ v5.5-YiTian uploaded"

      - name: Upload to v5.6-YiTian Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v5.6-YiTian \
            release-apks/YitianRead-v5.6-YiTian.apk \
            release-apks/YitianNFC-v5.6-YiTian.apk \
            --clobber \
            --repo ${{ github.repository }}
          echo "✅ v5.6-YiTian uploaded"

      - name: Verify uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== v5.5-YiTian ==="
          gh release view v5.5-YiTian --repo ${{ github.repository }} --json assets --jq '.assets[].name'
          echo ""
          echo "=== v5.6-YiTian ==="
          gh release view v5.6-YiTian --repo ${{ github.repository }} --json assets --jq '.assets[].name'
          echo ""
          echo "🎉 All done!"
