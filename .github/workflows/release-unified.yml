name: Release (Unified)

on:
  push:
    branches: [v2]
    paths:
      - '.trigger-release-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v5.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2
        uses: actions/checkout@v4
        with:
          ref: v2
          submodules: recursive
          fetch-depth: 0

      - name: Extract tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Get changed files
            CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD | grep '\.trigger-release-' | head -1)
            if [ -z "$CHANGED" ]; then
              CHANGED=$(find . -maxdepth 1 -name '.trigger-release-*' -type f | head -1)
            fi
            TAG=$(echo "$CHANGED" | sed 's/.*\.trigger-release-//')
            echo "Extracted TAG from push: $TAG"
          else
            TAG="${{ github.event.inputs.tag }}"
            echo "Extracted TAG from dispatch: $TAG"
          fi
          
          if [ -z "$TAG" ]; then
            echo "ERROR: Could not extract tag!"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create & push tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" HEAD 2>/dev/null || echo "Tag already exists"
          git push origin "refs/tags/$TAG" 2>/dev/null || echo "Tag already on remote"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 && \
            echo "Release already exists" || \
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "NFCGate $TAG" \
              --target v2 \
              --generate-notes \
              --latest

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :app:assembleDebug \
            :app-reader:assembleDebug \
            :app-hce:assembleDebug \
            --no-daemon --stacktrace

      - name: Collect & rename APKs
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for f in app/build/outputs/apk/debug/*.apk app-reader/build/outputs/apk/debug/*.apk app-hce/build/outputs/apk/debug/*.apk; do
            base=$(basename "$f")
            case "$base" in
              app-debug.apk)        new="nfcgate-controller-${TAG}.apk" ;;
              app-reader-debug.apk) new="nfcgate-reader-${TAG}.apk" ;;
              app-hce-debug.apk)    new="nfcgate-hce-${TAG}.apk" ;;
              *)                    new="$base" ;;
            esac
            cp "$f" "release-assets/$new"
          done
          cd release-assets
          sha256sum * | tee SHA256SUMS.txt
          ls -la

      - name: Upload APKs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cd release-assets
          gh release upload "$TAG" * \
            --repo "${{ github.repository }}" \
            --clobber
          echo "✅ Release $TAG complete!"
