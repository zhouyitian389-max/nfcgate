name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and upload APKs for (e.g. v4.1)'
        required: true
        default: 'v4.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Compute tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        continue-on-error: true

      - name: Build APKs (release first, fallback to debug)
        id: build
        continue-on-error: true
        run: |
          chmod +x ./gradlew || true
          ./gradlew \
            :app:assembleRelease \
            :app-reader:assembleRelease \
            :app-hce:assembleRelease \
            --no-daemon --stacktrace 2>/dev/null || \
          ./gradlew \
            :app:assembleDebug \
            :app-reader:assembleDebug \
            :app-hce:assembleDebug \
            --no-daemon --stacktrace || true

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for f in \
              app/build/outputs/apk/release/*.apk \
              app/build/outputs/apk/debug/*.apk \
              app-reader/build/outputs/apk/release/*.apk \
              app-reader/build/outputs/apk/debug/*.apk \
              app-hce/build/outputs/apk/release/*.apk \
              app-hce/build/outputs/apk/debug/*.apk \
              plugins-sample/build/outputs/plugins/*.jar \
              plugins-sample-js/build/outputs/plugins-js/*.zip ; do
            cp "$f" release-assets/ || true
          done
          ls -la release-assets
          count=$(find release-assets -type f | wc -l | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Found ${count} artifact(s)"

      - name: Upload APKs to Release (create or update)
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          # Create release if it doesn't exist, otherwise just upload assets
          gh release view "$TAG" --repo ${{ github.repository }} > /dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo ${{ github.repository }} \
              --title "NFCGate ${TAG}" \
              --generate-notes \
              --latest
          # Force-upload all assets (--clobber overwrites existing files)
          if [ "$(find release-assets -type f | wc -l)" -gt 0 ]; then
            gh release upload "$TAG" release-assets/* \
              --repo ${{ github.repository }} \
              --clobber
            echo "✅ APKs uploaded successfully"
          else
            echo "⚠️ No artifacts found to upload"
          fi
