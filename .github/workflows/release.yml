name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tag and notes path
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          NOTES_FILE="RELEASE_NOTES_${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
            echo "Found release notes at ${NOTES_FILE}"
          else
            echo "notes_file=" >> "$GITHUB_OUTPUT"
            echo "No ${NOTES_FILE} found; will auto-generate notes."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        continue-on-error: true

      - name: Build APKs and plugin artifacts (best effort)
        id: build
        continue-on-error: true
        run: |
          set -e
          chmod +x ./gradlew || true
          ./gradlew \
            :app:assembleDebug \
            :app-reader:assembleDebug \
            :app-hce:assembleDebug \
            :plugins-sample:assemblePluginDex \
            :plugins-sample-js:assembleJsPlugins \
            --no-daemon --stacktrace || true

      - name: Collect artifacts
        id: collect
        continue-on-error: true
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for f in \
              app/build/outputs/apk/debug/*.apk \
              app-reader/build/outputs/apk/debug/*.apk \
              app-hce/build/outputs/apk/debug/*.apk \
              plugins-sample/build/outputs/plugins/*.jar \
              plugins-sample-js/build/outputs/plugins-js/*.zip ; do
            cp "$f" release-assets/ || true
          done
          ls -la release-assets || true
          count=$(find release-assets -type f | wc -l | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: NFCGate ${{ steps.meta.outputs.tag }}
          body_path: ${{ steps.meta.outputs.notes_file }}
          generate_release_notes: ${{ steps.meta.outputs.notes_file == '' }}
          draft: false
          prerelease: false
          make_latest: 'true'
          files: |
            release-assets/*
          fail_on_unmatched_files: false
