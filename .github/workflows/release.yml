name: release

on:
  push:
    tags:
      - 'v2.2.0'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and upload release assets for (e.g. v2.2.0)'
        required: true
        default: 'v2.2.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Fetch required submodules
        run: git submodule update --init --depth=1 protobuf/src/main/proto/protocol nfcd/xHook

      - name: Compute tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        continue-on-error: true

      - name: Run Unit Tests
        run: |
          chmod +x ./gradlew || true
          ./gradlew :app-reader:testDebugUnitTest :app-hce:testDebugUnitTest \
            --no-daemon --stacktrace

      - name: Build release APKs
        id: build
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :app-reader:assembleRelease \
            :app-hce:assembleRelease \
            --no-daemon --stacktrace

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build server package
        run: |
          cd server
          npm ci
          npm run build
          zip -r "../nfcgate-server-${{ steps.meta.outputs.tag }}.zip" dist prisma package.json package-lock.json .env.example

      - name: Build admin-panel package
        run: |
          cd admin-panel
          npm ci
          npm run build
          zip -r "../nfcgate-admin-panel-${{ steps.meta.outputs.tag }}.zip" .next public src package.json package-lock.json next.config.ts tsconfig.json .env.example

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p release-assets
          TAG="${{ steps.meta.outputs.tag }}"
          cp app-hce/build/outputs/apk/release/app-hce-release.apk "release-assets/YitianNFC-${TAG}.apk"
          cp app-reader/build/outputs/apk/release/app-reader-release.apk "release-assets/YitianRead-${TAG}.apk"
          cp "nfcgate-server-${TAG}.zip" "release-assets/nfcgate-server-${TAG}.zip"
          cp "nfcgate-admin-panel-${TAG}.zip" "release-assets/nfcgate-admin-panel-${TAG}.zip"
          ls -la release-assets
          count=$(find release-assets -type f | wc -l | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Found ${count} artifact(s)"

      - name: Upload APKs to Release (create or update)
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          # Create release if it doesn't exist, otherwise just upload assets
          gh release view "$TAG" --repo ${{ github.repository }} > /dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo ${{ github.repository }} \
              --title "NFCGate ${TAG}" \
              --generate-notes \
              --latest
          gh release upload "$TAG" release-assets/* \
            --repo ${{ github.repository }} \
            --clobber
          echo "✅ APKs uploaded successfully"
