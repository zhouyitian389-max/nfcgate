name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and upload APKs for (e.g. v4.1)'
        required: true
        default: 'v4.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Compute tag and notes path
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          NOTES_FILE="RELEASE_NOTES_${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
            echo "Found release notes at ${NOTES_FILE}"
          else
            echo "notes_file=" >> "$GITHUB_OUTPUT"
            echo "No ${NOTES_FILE} found; will auto-generate notes."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        continue-on-error: true

      - name: Build APKs (release first, fallback to debug)
        id: build
        continue-on-error: true
        run: |
          chmod +x ./gradlew || true
          ./gradlew \
            :app:assembleRelease \
            :app-reader:assembleRelease \
            :app-hce:assembleRelease \
            --no-daemon --stacktrace || \
          ./gradlew \
            :app:assembleDebug \
            :app-reader:assembleDebug \
            :app-hce:assembleDebug \
            --no-daemon --stacktrace || true

      - name: Collect artifacts
        id: collect
        continue-on-error: true
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for f in \
              app/build/outputs/apk/release/*.apk \
              app/build/outputs/apk/debug/*.apk \
              app-reader/build/outputs/apk/release/*.apk \
              app-reader/build/outputs/apk/debug/*.apk \
              app-hce/build/outputs/apk/release/*.apk \
              app-hce/build/outputs/apk/debug/*.apk \
              plugins-sample/build/outputs/plugins/*.jar \
              plugins-sample-js/build/outputs/plugins-js/*.zip ; do
            cp "$f" release-assets/ || true
          done
          ls -la release-assets || true
          count=$(find release-assets -type f | wc -l | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: NFCGate ${{ steps.meta.outputs.tag }}
          body_path: ${{ steps.meta.outputs.notes_file }}
          generate_release_notes: ${{ steps.meta.outputs.notes_file == '' }}
          draft: false
          prerelease: false
          make_latest: 'true'
          files: |
            release-assets/*
          fail_on_unmatched_files: false
