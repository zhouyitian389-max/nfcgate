name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and upload release assets for (e.g. v2.3.0)'
        required: true
        default: 'v2.3.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEYSTORE_KEY_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'v2' || github.ref }}

      - name: Create and push tag if workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ inputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping creation"
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "refs/tags/${TAG}"
            echo "✅ Tag ${TAG} created and pushed"
          fi

      - name: Fetch required submodules
        run: git submodule update --init --depth=1 protobuf/src/main/proto/protocol nfcd/xHook

      - name: Compute tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release-keystore.jks
          mkdir -p .ci-files
          echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" > .ci-files/release-keystore.properties
          echo "storeFile=${{ github.workspace }}/release-keystore.jks" >> .ci-files/release-keystore.properties
          echo "Keystore properties:"
          cat .ci-files/release-keystore.properties
          echo "Keystore file size:"
          ls -la ${{ github.workspace }}/release-keystore.jks

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        continue-on-error: true

      - name: Build release APKs
        id: build
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :app-reader:assembleRelease \
            :app-hce:assembleRelease \
            --no-daemon --stacktrace -x test

      - name: Verify APK signing
        run: |
          echo "=== Checking APK signatures ==="
          if [ -f "app-hce/build/outputs/apk/release/app-hce-release.apk" ]; then
            $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs app-hce/build/outputs/apk/release/app-hce-release.apk && echo "✅ HCE APK signed" || echo "❌ HCE APK NOT signed"
          fi
          if [ -f "app-reader/build/outputs/apk/release/app-reader-release.apk" ]; then
            $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs app-reader/build/outputs/apk/release/app-reader-release.apk && echo "✅ Reader APK signed" || echo "❌ Reader APK NOT signed"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build server package
        run: |
          cd server
          npm ci
          npm run build
          zip -r "../nfcgate-server-${{ steps.meta.outputs.tag }}.zip" dist prisma package.json package-lock.json .env.example

      - name: Build admin-panel package
        run: |
          cd admin-panel
          npm ci
          npm run build
          zip -r "../nfcgate-admin-panel-${{ steps.meta.outputs.tag }}.zip" .next public src package.json package-lock.json next.config.ts tsconfig.json .env.example

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p release-assets
          TAG="${{ steps.meta.outputs.tag }}"
          if [ -f "app-hce/build/outputs/apk/release/app-hce-release.apk" ]; then
            cp app-hce/build/outputs/apk/release/app-hce-release.apk "release-assets/YitianNFC-${TAG}.apk"
          fi
          if [ -f "app-reader/build/outputs/apk/release/app-reader-release.apk" ]; then
            cp app-reader/build/outputs/apk/release/app-reader-release.apk "release-assets/YitianRead-${TAG}.apk"
          fi
          cp "nfcgate-server-${TAG}.zip" "release-assets/nfcgate-server-${TAG}.zip"
          cp "nfcgate-admin-panel-${TAG}.zip" "release-assets/nfcgate-admin-panel-${TAG}.zip"
          ls -la release-assets
          count=$(find release-assets -type f | wc -l | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Found ${count} artifact(s)"

      - name: Upload APKs to Release (create or update)
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          gh release view "$TAG" --repo ${{ github.repository }} > /dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo ${{ github.repository }} \
              --title "NFCGate ${TAG}" \
              --generate-notes \
              --latest
          gh release upload "$TAG" release-assets/* \
            --repo ${{ github.repository }} \
            --clobber
          echo "✅ Release ${TAG} published successfully"
