name: fuzz-regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run parser regression suite
        run: ./gradlew --init-script .github/ci/init.gradle :app-reader:testDebugUnitTest --stacktrace
      - name: Run upload server parser tests
        run: |
          cd tools/upload-server
          python -m unittest discover tests
