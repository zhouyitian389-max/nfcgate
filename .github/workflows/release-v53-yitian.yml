name: release-v5.3-YiTian

on:
  push:
    branches: [v2]
    paths:
      - '.github/workflows/release-v53-yitian.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        continue-on-error: true

      - name: Build APKs
        id: build
        continue-on-error: true
        run: |
          chmod +x ./gradlew || true
          ./gradlew \
            :app-reader:assembleRelease \
            :app-hce:assembleRelease \
            --no-daemon --stacktrace 2>/dev/null || \
          ./gradlew \
            :app-reader:assembleDebug \
            :app-hce:assembleDebug \
            --no-daemon --stacktrace || true

      - name: Collect artifacts
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for f in \
              app-reader/build/outputs/apk/release/*.apk \
              app-reader/build/outputs/apk/debug/*.apk \
              app-hce/build/outputs/apk/release/*.apk \
              app-hce/build/outputs/apk/debug/*.apk; do
            cp "$f" release-assets/ || true
          done
          echo "Artifacts:"
          ls -la release-assets || echo "none"

      - name: Create Release and upload APKs
        run: |
          TAG="v5.3-YiTian"
          gh release view "$TAG" --repo ${{ github.repository }} > /dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo ${{ github.repository }} \
              --target v2 \
              --title "NFCGate v5.3-YiTian" \
              --latest \
              --notes "## NFCGate v5.3-YiTian

### 🔧 Bug Fixes (PR #57, #58)
- Fixed missing ic_launcher_round resources in app-hce
- Fixed Room main thread queries in app-hce
- Fixed CSV export line endings and RFC4180 escaping in app-reader
- Fixed inverted black/white color values
- Fixed HttpReceiverService null intent and API 34+ foreground type
- Fixed USBConnection permission check and bulkTransfer return value
- Fixed UploadService stream close and error handling
- Fixed app-reader AndroidManifest usesCleartextTraffic

### ⚡ Optimizations (PR #59)
- versionCode bumped to 101, versionName v5.3-YiTian
- Enabled R8/ProGuard with keep rules for NanoHTTPD and Room
- YitianHostApduService: volatile cachedCard + BroadcastReceiver refresh
- UploadService: exponential backoff retry (3x, 2s/4s/8s, IOException/5xx only)

**Full Changelog**: https://github.com/zhouyitian389-max/nfcgate/compare/off-v5.0Yitian...v5.3-YiTian"
          if [ "\$(find release-assets -type f | wc -l)" -gt 0 ]; then
            gh release upload "$TAG" release-assets/* \
              --repo ${{ github.repository }} \
              --clobber
            echo "✅ APKs uploaded"
          else
            echo "⚠️ No APKs to upload"
          fi
