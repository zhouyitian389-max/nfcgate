name: Upload APKs to v5.3-YiTian

on:
  push:
    branches: [v2]
    paths:
      - '.github/workflows/release-v53-yitian.yml'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build debug APKs
        run: ./gradlew :app-reader:assembleDebug :app-hce:assembleDebug --no-daemon --stacktrace

      - name: Upload APKs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v5.3-YiTian"
          find . -name "*.apk" -path "*/build/outputs/*"
          gh release upload "$TAG" \
            app-reader/build/outputs/apk/debug/*.apk \
            app-hce/build/outputs/apk/debug/*.apk \
            --repo "${{ github.repository }}" \
            --clobber
          echo "Done - APKs uploaded to $TAG"
