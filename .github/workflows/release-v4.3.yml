name: release-v4.3

# One-shot: create tag v4.3, create release, build APKs, upload.
on:
  push:
    branches: [v2]
    paths:
      - '.trigger-release-v4.3'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v4.3
    steps:
      - name: Checkout v2 HEAD
        uses: actions/checkout@v4
        with:
          ref: v2
          submodules: recursive
          fetch-depth: 0

      - name: Create & push tag v4.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" || echo "Tag already exists"
          git push origin "refs/tags/$TAG" || echo "Tag already on remote"

      - name: Create GitHub Release
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 && echo "Release exists" || \
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "NFCGate $TAG" \
              --target v2 \
              --generate-notes \
              --latest

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build debug APKs (all 3 modules)
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :app:assembleDebug \
            :app-reader:assembleDebug \
            :app-hce:assembleDebug \
            --no-daemon --stacktrace

      - name: Collect & rename APKs
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for f in \
              app/build/outputs/apk/debug/*.apk \
              app-reader/build/outputs/apk/debug/*.apk \
              app-hce/build/outputs/apk/debug/*.apk ; do
            base=$(basename "$f")
            case "$base" in
              app-debug.apk)        new="nfcgate-controller-${TAG}.apk" ;;
              app-reader-debug.apk) new="nfcgate-reader-${TAG}.apk" ;;
              app-hce-debug.apk)    new="nfcgate-hce-${TAG}.apk" ;;
              *)                    new="$base" ;;
            esac
            cp "$f" "release-assets/$new"
          done
          cd release-assets
          sha256sum * | tee SHA256SUMS.txt
          ls -la

      - name: Upload APKs to v4.3 release
        run: |
          gh release upload "$TAG" release-assets/* \
            --repo "${{ github.repository }}" \
            --clobber
          echo "✅ v4.3 APKs + SHA256SUMS uploaded"
