name: fix-v4.2-apks

# One-shot: build debug APKs from v4.2 tag and upload them to the v4.2 Release.
# Uses the same setup as build-android.yml which is known to succeed.
on:
  push:
    branches: [v2]
    paths:
      - '.trigger-fix-v4.2'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v4.2
    steps:
      - name: Checkout tag v4.2
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v4.2
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build debug APKs (all 3 modules)
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :app:assembleDebug \
            :app-reader:assembleDebug \
            :app-hce:assembleDebug \
            --no-daemon --stacktrace

      - name: Collect & rename APKs
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for f in \
              app/build/outputs/apk/debug/*.apk \
              app-reader/build/outputs/apk/debug/*.apk \
              app-hce/build/outputs/apk/debug/*.apk ; do
            base=$(basename "$f")
            # Map to friendly name
            case "$base" in
              app-debug.apk)        new="nfcgate-controller-${TAG}.apk" ;;
              app-reader-debug.apk) new="nfcgate-reader-${TAG}.apk" ;;
              app-hce-debug.apk)    new="nfcgate-hce-${TAG}.apk" ;;
              *)                    new="$base" ;;
            esac
            cp "$f" "release-assets/$new"
          done
          cd release-assets
          sha256sum * | tee SHA256SUMS.txt
          ls -la

      - name: Upload to v4.2 release
        run: |
          gh release upload "$TAG" release-assets/* \
            --repo "${{ github.repository }}" \
            --clobber
          echo "✅ v4.2 APKs + SHA256SUMS uploaded"
