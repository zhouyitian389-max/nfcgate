name: tag-and-release

# Push .trigger-tag-* file to create tag and fire release workflow.
on:
  push:
    branches: [v2]
    paths:
      - '.trigger-tag-*'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag from trigger filename
        id: tag
        run: |
          # Find the most recently modified .trigger-tag-* file
          f=$(ls -t .trigger-tag-* 2>/dev/null | head -1)
          if [ -z "$f" ]; then echo "No trigger file"; exit 1; fi
          tag="${f#.trigger-tag-}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Creating tag: $tag"

      - name: Create & push annotated tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists, deleting first"
            git tag -d "$TAG" || true
            git push origin ":refs/tags/$TAG" || true
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "✅ Pushed tag $TAG → release workflow will trigger automatically"
