name: dispatch-release-v4.2

# One-shot workflow to create v4.2 tag + invoke release.yml.
on:
  push:
    branches: [v2]
    paths:
      - '.trigger-dispatch-v4.2'

permissions:
  contents: write
  actions: write

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v4.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag if missing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists locally"
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi
          # Push (ignore "already exists" remote error)
          git push origin "refs/tags/$TAG" || echo "Tag push: maybe already on remote"

      - name: Create empty release if missing
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "NFCGate $TAG" \
              --target v2 \
              --generate-notes \
              --latest

      - name: Dispatch release.yml with input tag
        run: |
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref v2 \
            -f tag="$TAG"
          echo "✅ release.yml dispatched for $TAG"
